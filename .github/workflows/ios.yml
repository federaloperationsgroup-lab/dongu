name: iOS (Döngü)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/ios.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Bağımlılıklar
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Web paketi (www)
        working-directory: mobile
        run: sh prepare-www.sh
      - name: iOS projesi
        working-directory: mobile
        run: npx cap add ios && sh patch-native.sh ios
      - name: Simgeler ve açılış ekranı
        working-directory: mobile
        run: npx @capacitor/assets generate --ios --iconBackgroundColor '#0f1430' --iconBackgroundColorDark '#0f1430' --splashBackgroundColor '#0f1430' --splashBackgroundColorDark '#0f1430'
      - name: Eşitle
        working-directory: mobile
        run: npx cap sync ios
      - name: Derle (simülatör, imzasız — proje doğrulaması)
        working-directory: mobile/ios/App
        run: xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -40
      - name: Bilgi
        run: |
          echo "iOS projesi derlendi (simülatör). Mağaza paketi için: Apple Developer hesabı → sertifika + profil → GitHub Secrets → archive adımı."
          plutil -p mobile/ios/App/App/Info.plist | grep -E 'CFBundle(ShortVersion|Version|Identifier|DisplayName)|Orientation|StatusBar' || true
      - name: Derleme bilgisi (ios-latest sürüm sayfası)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p out
          { echo "sürüm $(cat mobile/version.txt) kod $(cat mobile/versioncode.txt) commit ${{ github.sha }} derleme #${{ github.run_number }}"; echo "--- Info.plist ---"; plutil -p mobile/ios/App/App/Info.plist; echo "--- Podfile.lock (RevenueCat/Capacitor) ---"; grep -E 'Capacitor|RevenueCat|Purchases' mobile/ios/App/Podfile.lock | head -20; echo "--- derleme çıktısı ---"; ls -la mobile/ios/App/build 2>/dev/null || true; find ~/Library/Developer/Xcode/DerivedData -name 'App.app' -maxdepth 6 2>/dev/null | head -3; } > out/ios-build-info.txt 2>&1 || true
          gh release view ios-latest >/dev/null 2>&1 || gh release create ios-latest --prerelease --title "iOS derlemesi (son)" --notes "iOS projesi simülatör için derlendi (imzasız). Mağaza paketi için Apple hesabı + imza sırları gerekir."
          gh release upload ios-latest out/ios-build-info.txt --clobber
