name: iOS (Döngü)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/ios.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }   # v10.19: Capacitor 8 komut satırı Node 22 ister
      - name: Bağımlılıklar
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Web paketi (www)
        working-directory: mobile
        run: sh prepare-www.sh
      - name: iOS projesi
        working-directory: mobile
        run: npx cap add ios --packagemanager CocoaPods && sh patch-native.sh ios   # v10.19: Capacitor 8'de varsayılan SPM; reklam ve satın alma eklentileri CocoaPods ile kurulur
      - name: Simgeler ve açılış ekranı
        working-directory: mobile
        run: npx @capacitor/assets generate --ios --iconBackgroundColor '#0f1430' --iconBackgroundColorDark '#0f1430' --splashBackgroundColor '#0f1430' --splashBackgroundColorDark '#0f1430'
      - name: Eşitle
        working-directory: mobile
        run: npx cap sync ios
      - name: Derle (simülatör, imzasız — proje doğrulaması; derleme hatası iş akışını da kırar)
        working-directory: mobile/ios/App
        run: set -o pipefail; xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -40
      - name: Bilgi
        run: |
          echo "iOS projesi derlendi (simülatör). Mağaza paketi için: Apple Developer hesabı → sertifika + profil → GitHub Secrets → archive adımı."
          plutil -p mobile/ios/App/App/Info.plist | grep -E 'CFBundle(ShortVersion|Version|Identifier|DisplayName)|Orientation|StatusBar|GADApplicationIdentifier' || true
      - name: Derleme bilgisi (ios-latest sürüm sayfası)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p out
          { echo "sürüm $(cat mobile/version.txt) kod $(cat mobile/versioncode.txt) commit ${{ github.sha }} derleme #${{ github.run_number }}"; echo "--- Info.plist ---"; plutil -p mobile/ios/App/App/Info.plist; echo "--- eklentiler (kurulan sürümler) ---"; (cd mobile && npm ls --depth=0 2>/dev/null | grep -E '@capacitor|@revenuecat'); echo "--- Podfile.lock (Capacitor / RevenueCat / Google reklam) ---"; grep -E 'Capacitor|RevenueCat|Purchases|Google-Mobile-Ads-SDK|GoogleUserMessagingPlatform|Admob' mobile/ios/App/Podfile.lock | head -40; echo "--- v10.19: reklam kimliği ve ağ listesi ---"; /usr/libexec/PlistBuddy -c 'Print :GADApplicationIdentifier' mobile/ios/App/App/Info.plist; echo "SKAdNetworkItems: $(/usr/libexec/PlistBuddy -c 'Print :SKAdNetworkItems' mobile/ios/App/App/Info.plist | grep -c skadnetwork)"; echo "--- uygulama simgesi (alfa olmamalı) ---"; for f in mobile/ios/App/App/Assets.xcassets/AppIcon.appiconset/*.png; do echo "$(basename "$f"): $(sips -g hasAlpha -g pixelWidth "$f" | tail -2 | tr -s ' \n' ' ')"; done; echo "--- en düşük iOS sürümü ---"; grep -m1 'platform :ios' mobile/ios/App/Podfile; grep -m2 'IPHONEOS_DEPLOYMENT_TARGET' mobile/ios/App/App.xcodeproj/project.pbxproj; echo "--- derleme çıktısı ---"; ls -la mobile/ios/App/build 2>/dev/null || true; find ~/Library/Developer/Xcode/DerivedData -name 'App.app' -maxdepth 6 2>/dev/null | head -3; } > out/ios-build-info.txt 2>&1 || true
          grep -v -i -E 'skadnetwork|^ +[0-9]+ => \{$|^ +\}$' out/ios-build-info.txt | head -260   # reklam ağı listesi (50 satır) günlüğü doldurmasın
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then   # v10.19: deneme dallarındaki derleme sürüm sayfasını değiştirmez
            gh release view ios-latest >/dev/null 2>&1 || gh release create ios-latest --prerelease --title "iOS derlemesi (son)" --notes "iOS projesi simülatör için derlendi (imzasız). Mağaza paketi için Apple hesabı + imza sırları gerekir."
            gh release upload ios-latest out/ios-build-info.txt --clobber
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "ios-${{ github.run_number }}"
          path: "out/"
          retention-days: 30
