name: Android (Döngü)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['public.zip', 'public-*.zip', 'assets.zip', 'assets-*.zip', 'mobile/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }   # v10.19: Capacitor 8 komut satırı Node 22 ister
      - name: Bağımlılıklar
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Web paketi (www)
        working-directory: mobile
        run: sh prepare-www.sh
      - name: Android projesi
        working-directory: mobile
        run: npx cap add android && sh patch-native.sh android
      - name: Simgeler ve açılış ekranı
        working-directory: mobile
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0f1430' --iconBackgroundColorDark '#0f1430' --splashBackgroundColor '#0f1430' --splashBackgroundColorDark '#0f1430'
      - name: Eşitle
        working-directory: mobile
        run: npx cap sync android
      - name: Sabit test imzası (v10.08; her APK aynı anahtarla imzalanır → yeni sürüm eskisinin üstüne kurulur, oyun hesabı kalır)
        run: mkdir -p ~/.android && cp mobile/debug-test.keystore ~/.android/debug.keystore
      - name: Derle (debug APK + release AAB, imzasız)
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug bundleRelease
      - name: Çıktılar
        run: |
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk out/dongu-debug-$(cat mobile/version.txt).apk
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk out/dongu.apk   # sabit ad: .../releases/download/android-latest/dongu.apk hep son sürüm
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab out/dongu-release-unsigned-$(cat mobile/version.txt).aab
          { echo "sürüm $(cat mobile/version.txt) kod $(cat mobile/versioncode.txt) commit ${{ github.sha }} derleme #${{ github.run_number }}"; echo "--- AndroidManifest (MainActivity) ---"; tr '\n' ' ' < mobile/android/app/src/main/AndroidManifest.xml | grep -o '<activity[^>]*MainActivity[^>]*' | tr ' ' '\n' | grep -E 'screenOrientation|android:name|configChanges|launchMode' ; echo "--- build.gradle ---"; grep -E 'versionCode|versionName|applicationId' mobile/android/app/build.gradle; echo "--- styles.xml ---"; grep -E 'windowFullscreen|NoActionBarLaunch' mobile/android/app/src/main/res/values/styles.xml; echo "--- izinler (kaynak) ---"; grep -o 'uses-permission[^/]*' mobile/android/app/src/main/AndroidManifest.xml; echo "--- v10.19: reklam kimliği, oyun kategorisi, büyük ekran ---"; grep -o 'appCategory="[^"]*"\|com.google.android.gms.ads.APPLICATION_ID" android:value="[^"]*"\|PROPERTY_COMPAT_ALLOW_RESTRICTED_RESIZABILITY" android:value="[^"]*"' mobile/android/app/src/main/AndroidManifest.xml; echo "--- SDK düzeyleri (variables.gradle) ---"; grep -E 'minSdkVersion|compileSdkVersion|targetSdkVersion' mobile/android/variables.gradle; echo "--- eklentiler (kurulan sürümler) ---"; (cd mobile && npm ls --depth=0 2>/dev/null | grep -E '@capacitor|@revenuecat'); echo "--- APK'dan okunan (aapt2) ---"; AAPT="$(ls -d $ANDROID_HOME/build-tools/* | tail -1)/aapt2"; "$AAPT" dump badging out/dongu.apk | grep -E "^package:|^sdkVersion|^targetSdkVersion|^uses-permission|^application-label:"; "$AAPT" dump xmltree --file AndroidManifest.xml out/dongu.apk | grep -E "appCategory|APPLICATION_ID|RESTRICTED_RESIZABILITY|screenOrientation" | head -8; echo "--- www ---"; find mobile/www -type f | wc -l; grep -o "VERSION = '[0-9.]*'" mobile/www/index.html | head -1; grep -c "window.DONGU_CONFIG" mobile/www/index.html; echo "--- APK imzası ---"; "$(ls -d $ANDROID_HOME/build-tools/* | tail -1)/apksigner" verify --print-certs out/dongu.apk | grep -i 'SHA-256'; } > out/build-info.txt 2>&1 || true
          cat out/build-info.txt   # v10.19: günlükte de görünsün (deneme dalı derlemelerinde sürüm sayfasına yüklenmez)
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: "android-${{ github.run_number }}"
          path: "out/"
          retention-days: 30
      - name: Sürüm sayfasına koy (android-latest; telefondan doğrudan indirilebilir)
        if: github.ref == 'refs/heads/main'   # v10.19: deneme dallarındaki derleme testerların indirdiği sürüm sayfasını değiştirmez (çıktı yalnız iş akışı ekinde kalır)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          V=$(cat mobile/version.txt)
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --prerelease --title "Android derlemesi (son)" --notes "GitHub Actions'ın her yüklemede ürettiği Android paketleri. APK: telefona doğrudan kurulur (bilinmeyen kaynaklara izin). AAB: Play Console için (imzalanır)."
          # eski sürümlerin dosyalarını temizle (sürüm sayfasında yalnız son derleme kalsın)
          for a in $(gh release view android-latest --json assets --jq '.assets[].name'); do case "$a" in *"-$V."*|build-info.txt|dongu.apk|dongu-debug-10.18.apk) ;; *) gh release delete-asset android-latest "$a" -y || true;; esac; done   # dongu-debug-10.18.apk: eski kabuklu (Capacitor 7) son sürüm; yeni kabuk gerçek telefonda doğrulanana kadar yedek olarak durur
          gh release upload android-latest out/* --clobber
          gh release edit android-latest --notes "Sürüm $V · derleme #${{ github.run_number }} · $(date -u +%Y-%m-%dT%H:%MZ) · commit ${{ github.sha }}. APK telefona doğrudan kurulur; AAB Play Console için (imzalanır)."
